# The "dlc" environment for the laptop: labelling GUI, training and analysis.
#
#   conda env create -f environment.yml
#   conda activate dlc
#
# For a headless machine (no labelling GUI), use environment-lab.yml instead.
# The cu126 PyTorch build needs an NVIDIA driver that supports CUDA 12.6 (check nvidia-smi).
name: dlc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      - torchvision==0.29.1+cu126
      - deeplabcut[gui,modelzoo]==3.0.2
      - napari-deeplabcut==0.4.0
      - napari==0.9.2
variables:
  # Needed for the napari labelling window under WSL.
  QT_QPA_PLATFORM: xcb
  QT_XCB_GL_INTEGRATION: xcb_glx
  PYOPENGL_PLATFORM: glx
